<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Silly Food" />
    <meta name="theme-color" content="#ffe8a3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Silly Food</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #ffe8a3; overflow: hidden;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
      #reload {
        position: fixed; z-index: 10;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%;
        background: rgba(90, 58, 34, 0.35); color: #fff;
        font: bold 30px/52px system-ui, sans-serif; text-align: center;
        touch-action: manipulation;
      }
      #reload:active { background: rgba(90, 58, 34, 0.7); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="reload" type="button" aria-label="Reload game">&#x21bb;</button>
    <script>
      document.getElementById('reload').addEventListener('click', function () { location.reload(); });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
